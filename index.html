<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllAP — AP Practice Quizzes</title>
  <meta
    name="description"
    content="AllAP: free AP Government and AP Biology practice quizzes, made by a student for students."
  />

  <!-- Google Fonts (Fraunces for headings, Inter for body/UI). Preconnect hints speed up the font request. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <a class="site-title" href="index.html">AllAP<span class="site-tagline">AP Practice Quizzes</span></a>
      <nav>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="home-layout">
    <div class="home-content">
      <!-- js/homepage.js sets these: the copy differs between the subject
           picker and a single subject's unit list. -->
      <p class="intro" id="intro">Loading…</p>
      <a id="back-link" class="btn-secondary hidden" href="index.html">← All subjects</a>

      <!-- js/exam-banner.js fills this in: exam countdown + weakest topic. -->
      <div id="exam-countdown" class="hidden"></div>

      <!-- js/progress.js + js/recommendations.js fill this in when a lesson needs review. -->
      <div id="recommendations" class="hidden"></div>

      <h2 id="list-heading">Subjects</h2>
      <!-- js/homepage.js fills this in: subject cards, or one subject's units. -->
      <div id="units-list"></div>
    </div>

    <aside class="home-sidebar">
      <div class="mastery-note">
        We recommend retaking the quiz until you get a 90% to ensure you have mastered the topics.
      </div>
    </aside>
  </main>

  <footer class="page-footer">
    Free study aid, not official course material.
    <a href="about.html">Read more</a>.
  </footer>

  <!-- Anonymous usage tracking + local progress tracking (used by recommendations.js). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/tracking.js"></script>
  <script src="js/progress.js"></script>

  <!-- Data first, then the scripts that read it. -->
  <!-- Each subject's registry defines its own globals (AP Gov: QUIZ_LIST /
       UNITS, AP Bio: BIO_QUIZ_LIST / BIO_UNITS) so they never clobber each
       other. js/subjects.js joins them and must load after both. -->
  <script src="quizzes/index.js"></script>
  <script src="quizzes/units.js"></script>
  <script src="quizzes-bio/index.js"></script>
  <script src="quizzes-bio/units.js"></script>
  <script src="js/subjects.js"></script>
  <script src="js/exam-dates.js"></script>
  <script src="js/exam-banner.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/homepage.js"></script>
</body>
</html>
