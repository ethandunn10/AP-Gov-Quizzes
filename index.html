<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllAP — AP Gov Practice Quizzes</title>
  <meta
    name="description"
    content="AllAP: free weekly AP US Government practice quizzes, made by a student for students."
  />

  <!-- Google Font (Inter). Preconnect hints speed up the font request. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <a class="site-title" href="index.html">AllAP<span class="site-tagline">AP Gov Practice Quizzes</span></a>
      <nav>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="home-layout">
    <div class="home-content">
      <p class="intro">Unit 1 is live now -- pick a lesson below and start quizzing.</p>

      <!-- js/progress.js + js/recommendations.js fill this in when a lesson needs review. -->
      <div id="recommendations" class="hidden"></div>

      <h2>Units</h2>
      <!-- quizzes/units.js + js/homepage.js fill this in. -->
      <div id="units-list"></div>
    </div>

    <aside class="home-sidebar">
      <div class="mastery-note">
        We recommend retaking the quiz until you get a 90% to ensure you have mastered the topics.
      </div>
    </aside>
  </main>

  <footer class="page-footer">
    Free study aid, not official course material.
    <a href="about.html">Read more</a>.
  </footer>

  <!-- Anonymous usage tracking + local progress tracking (used by recommendations.js). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/tracking.js"></script>
  <script src="js/progress.js"></script>

  <!-- Data first, then the scripts that read it. -->
  <script src="quizzes/index.js"></script>
  <script src="quizzes/units.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/homepage.js"></script>
</body>
</html>
