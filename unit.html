<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit — AP Gov Practice Quizzes</title>
  <meta name="description" content="Pick a lesson to quiz yourself on, or take a quiz covering the whole unit." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <a class="site-title" href="index.html">AP Gov Practice Quizzes</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Shown while quizzes/units.js + quizzes/index.js are being read. -->
    <p id="loading" class="status-message">Loading unit…</p>

    <!-- Shown if the ?unit= id in the URL doesn't match a known unit. -->
    <div id="error-state" class="card hidden">
      <p>We couldn't find that unit.</p>
      <a class="btn-secondary" href="index.html">← Back to home</a>
    </div>

    <div id="unit-content" class="hidden">
      <h1 id="unit-heading"></h1>

      <!-- js/recommendations.js fills this in when a lesson in this unit is flagged. -->
      <div id="recommendations" class="hidden"></div>

      <!-- js/unit.js fills this in: one card per lesson. -->
      <div id="lesson-list"></div>

      <a id="whole-unit-button" class="quiz-card quiz-card-featured whole-unit-button" href="#">
        <span class="quiz-topic">Take a quiz on the whole unit</span>
        <span class="quiz-cta">10 random questions from any lesson →</span>
      </a>
    </div>
  </main>

  <footer class="page-footer">
    Free study aid, not official course material.
    <a href="about.html">Read more</a>.
  </footer>

  <!-- Anonymous usage tracking + local progress tracking (used by recommendations.js). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/tracking.js"></script>
  <script src="js/progress.js"></script>

  <script src="quizzes/index.js"></script>
  <script src="quizzes/units.js"></script>
  <script src="js/recommendations.js"></script>
  <script src="js/unit.js"></script>
</body>
</html>
